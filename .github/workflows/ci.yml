name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Create virtual environment
        run: python -m venv .venv
      - name: Install locked dependencies
        run: .venv/bin/python -m pip install -c requirements-lock.txt -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check buddy tests
      - name: Type check
        run: .venv/bin/pyright
      - name: Tests and coverage
        run: .venv/bin/pytest --cov=buddy --cov-report=term-missing --cov-fail-under=80 -q
